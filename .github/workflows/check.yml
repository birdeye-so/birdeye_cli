name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a changelog update
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CHANGELOG_BASE" ]; then
            node scripts/check-changelog.mjs --base "$CHANGELOG_BASE"
          else
            node scripts/check-changelog.mjs
          fi
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/check-changelog.mjs --release
          node scripts/check-public-files.mjs --history
          node scripts/check-secrets.mjs --history
      - name: Reject internal documents in the source tree
        run: node scripts/check-public-files.mjs
      - name: Reject credential literals in the source tree
        run: node scripts/check-secrets.mjs
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.16.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check dependency advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix apps/skills-api --audit-level=high
          npm audit --prefix apps/landing --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
