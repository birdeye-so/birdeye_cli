name: Landing
on:
  pull_request:
    paths: ['apps/landing/**', 'scripts/*landing*', 'tests/landing*', 'src/**', 'skills/**', 'docs/workflows/**', 'package*.json', '.github/workflows/landing.yml']
  push:
    paths: ['apps/landing/**', 'scripts/*landing*', 'tests/landing*', 'src/**', 'skills/**', 'docs/workflows/**', 'package*.json', '.github/workflows/landing.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/landing/package-lock.json
      - run: npm ci
      - run: npm run landing:install
      - run: npm run test:landing
      - run: npm run landing:build
      - run: npm run landing:typecheck
